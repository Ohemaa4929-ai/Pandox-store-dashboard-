body{padding:env(safe-area-inset-top,0) 0 calc(76px + env(safe-area-inset-bottom,0))}
header{position:sticky;top:0;z-index:20;background:#000;border-bottom:3px solid var(--rd);display:flex;align-items:center;gap:10px;padding:10px 14px}

header button{background:none;border:1px solid var(--ln);color:#fff;border-radius:8px;padding:7px 10px;font-size:13px}
main{padding:12px 14px;max-width:900px;margin:0 auto}
h2{margin:6px 0 12px;font-size:18px;background:linear-gradient(90deg,var(--rd),var(--rd2));padding:9px 12px;border-radius:8px}
h3{margin:18px 0 8px;font-size:15px;color:#fff;border-left:4px solid var(--rd);padding-left:8px}
.mu{color:var(--mu)}.err{border-color:var(--rd)!important;color:#ffb4b9}.ok{color:var(--ok)}
.box{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kpi{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px}.kpi small{color:var(--mu);font-size:12px;display:block}.kpi b{font-size:20px}.kpi.r{border-color:var(--rd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
button,.btn{font:inherit;font-size:14px;border-radius:10px;border:1px solid var(--rd);background:var(--rd);color:#fff;padding:11px 14px;cursor:pointer}
button.o{background:none;border-color:var(--ln)}button.g{background:#fff;color:#000;border-color:#fff}button.s{padding:7px 10px;font-size:12px}button.d{background:none;border-color:var(--rd);color:#ff7b84}
button:disabled{opacity:.5}
.f{display:block;margin:0 0 10px}.f span{display:block;font-size:12px;color:var(--mu);margin:0 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;background:#0b0b0b;color:#fff;border:1px solid var(--ln);border-radius:10px;padding:11px}
input[type=checkbox]{width:auto}label.ck{display:flex;gap:8px;align-items:center;margin:0 0 10px;font-size:14px}
.li{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--ln);cursor:pointer}.li:last-child{border:0}.li .t{flex:1;min-width:0}.li b{display:block}.li small{color:var(--mu)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#222;color:#ddd;margin-left:4px}.tag.r{background:var(--rd)}.tag.k{background:#1fa855;color:#fff}.tag.w{background:var(--wn);color:#000}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--ln)}td.n,th.n{text-align:right}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0d0d0d;border-top:3px solid var(--rd);display:flex;padding:4px 0 calc(4px + env(safe-area-inset-bottom,0))}
nav button{flex:1;background:none;border:0;border-radius:0;color:#d0d0d6;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav button.on{color:#fff}nav button.on svg{stroke:var(--rd)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}.chips button{flex:none;background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:8px 13px;font-size:13px}.chips button.on{background:var(--rd);border-color:var(--rd)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:14px;z-index:60;display:none;max-width:90vw;text-align:center}
#toast.bad{background:var(--rd);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet>div{background:#111;border-top:3px solid var(--rd);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0))}
.login{max-width:380px;margin:12vh auto;padding:0 18px;text-align:center}.login img{width:84px;border-radius:16px}.login h1{letter-spacing:.08em;font-size:22px}
.pimg{width:46px;height:46px;border-radius:8px;object-fit:cover;background:#fff}
.line{display:grid;grid-template-columns:1fr 64px 84px;gap:6px;align-items:center;margin:0 0 8px}.line input{padding:8px}
.big{font-size:22px;font-weight:700}.bar{height:8px;background:#222;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--rd)}

async function fetchReceipt(id){if(!RC[id]){const r=await get("receipts","id=eq."+id+"&select=*");if(!r.length)throw new Error("Receipt not found");RC[id]=r[0]}return RC[id]}
async function showReceipt(id){const rc=await fetchReceipt(id),d=rc.data;sheet(`<h3>${esc(rc.receipt_no)}</h3><div class="box"><b>${esc(d.customer.name)}</b><br><span class="mu">Order ${esc(d.order.ref)}</span><table style="margin-top:8px"><tr><td>Total</td><td class="n">${money(d.total)}</td></tr><tr><td>Paid to date</td><td class="n">${money(d.paid_to_date)}</td></tr><tr><td><b>Balance</b></td><td class="n"><b>${money(d.balance)}</b></td></tr></table></div><div class="row"><button data-a="rcpdf" data-i="${id}">Download PDF</button><button class="g" data-a="rcshare" data-i="${id}">Share</button><button class="o" data-a="rcprint" data-i="${id}">Print</button></div><div class="row" style="margin-top:10px"><button class="o" data-a="rcwa" data-i="${id}">Send by WhatsApp</button><button class="o" data-a="closesheet">Close</button></div>`)}
ACT.rcsheet=el=>showReceipt(el.dataset.i);
const rcBlob=rc=>new Blob([PDF.build(rc,LOGO)],{type:"application/pdf"});
const rcText=rc=>{const d=rc.data;return `Pandox receipt ${rc.receipt_no}\nOrder ${d.order.ref}\nTotal: GHS ${num(d.total).toFixed(2)}\nPaid to date: GHS ${num(d.paid_to_date).toFixed(2)}\nBalance: GHS ${num(d.balance).toFixed(2)}\n${d.footer||""}`};
ACT.rcpdf=async el=>{const rc=await fetchReceipt(el.dataset.i),u=URL.createObjectURL(rcBlob(rc)),a=document.createElement("a");a.href=u;a.download=rc.receipt_no+".pdf";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)};
ACT.rcprint=async el=>{const rc=await fetchReceipt(el.dataset.i),u=URL.createObjectURL(rcBlob(rc));window.open(u,"_blank")};
ACT.rcshare=async el=>{const rc=await fetchReceipt(el.dataset.i),f=new File([rcBlob(rc)],rc.receipt_no+".pdf",{type:"application/pdf"});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:rc.receipt_no,text:rcText(rc)})}catch(e){}}else{toast("File sharing is not available here. Download the PDF, or use WhatsApp.",true)}};
ACT.rcwa=async el=>{const rc=await fetchReceipt(el.dataset.i),p=waNum(rc.data.customer.phone);window.open("https://wa.me/"+(p||"")+"?text="+encodeURIComponent(rcText(rc)),"_blank")};

const POSNEW=()=>({src:"walk_in",name:"",phone:"",address:"",items:[],disc:0,fee:0,notes:"",pays:[{m:"cash",a:0,r:""}],q:""});
let POS=POSNEW();
const posSub=()=>POS.items.reduce((a,i)=>a+i.qty*i.price,0);
function posTax(base){const t=(DB.settings||{}).tax||{};if(!t.enabled)return{tax:0,total:base};const r=num(t.rate)/100;return t.inclusive?{tax:Math.round((base-base/(1+r))*100)/100,total:base}:{tax:Math.round(base*r*100)/100,total:base+Math.round(base*r*100)/100}}
const posTotals=()=>{const sub=posSub(),base=Math.max(sub-num(POS.disc),0),t=posTax(base),total=t.total+num(POS.fee),paid=POS.pays.reduce((a,p)=>a+num(p.a),0);return{sub,tax:t.tax,total,paid,bal:total-paid}};

  return `<h2>New sale</h2><div class="box"><div class="grid"><div>${fld("Sold via",`<select id="ps">${opt([["walk_in","Showroom walk-in"],["whatsapp","WhatsApp order"]],POS.src)}</select>`)}</div><div>${fld("Customer name (optional)",`<input id="pcn" value="${esc(POS.name)}">`)}</div></div><div class="grid"><div>${fld("Phone (for receipt)",`<input id="pcp" type="tel" value="${esc(POS.phone)}">`)}</div><div>${fld("Address or city",`<input id="pca" value="${esc(POS.address)}">`)}</div></div></div>
  <div class="box"><input id="pq" placeholder="Search a product to add" value="${esc(POS.q)}"><div id="pres"></div></div>
  <h3>Items</h3><div class="box" id="plines"></div>
  <div class="box"><div class="grid"><div>${fld("Discount (GH\u20B5)",`<input id="pd" type="number" inputmode="decimal" value="${POS.disc||""}">`)}</div><div>${fld("Delivery fee (GH\u20B5)",`<input id="pf" type="number" inputmode="decimal" value="${POS.fee||""}">`)}</div></div>${fld("Note",`<input id="pnote" value="${esc(POS.notes)}">`)}</div>
  <h3>Payment</h3><div class="box" id="ppays"></div><div class="box" id="ptot"></div>
  <div class="row"><button style="flex:1" data-a="possale">Complete sale</button><button class="o" data-a="posclear">Clear</button></div>`};
function posLines(){$("#plines").innerHTML=POS.items.length?POS.items.map((i,n)=>`<div class="line"><div><b style="font-size:13px">${esc(i.name)}</b><br><small class="mu">${i.track?"Stock "+i.stock:"Stock not tracked"}</small></div><input type="number" min="1" value="${i.qty}" data-posi="${n}" data-f="qty"><input type="number" inputmode="decimal" value="${i.price}" data-posi="${n}" data-f="price"></div><div class="row" style="margin:-4px 0 8px"><span class="sp"></span><button class="d s" data-a="posdel" data-i="${n}">Remove</button></div>`).join(""):'<p class="mu">No items yet.</p>'}
function posPays(){$("#ppays").innerHTML=POS.pays.map((p,n)=>`<div class="grid3" style="margin-bottom:8px"><select data-posp="${n}" data-f="m">${opt(DB.ms.map(m=>[m,ML[m]]),p.m)}</select><input type="number" inputmode="decimal" placeholder="Amount" value="${p.a||""}" data-posp="${n}" data-f="a"><input placeholder="Reference" value="${esc(p.r)}" data-posp="${n}" data-f="r"></div>`).join("")+'<button class="o s" data-a="posaddpay">Add another payment</button><p class="mu" style="font-size:12px">Leave the amount empty for a sale paid later. A deposit or part payment is fine.</p>'}
function posTot(){const t=posTotals();$("#ptot").innerHTML=`<table><tr><td>Subtotal</td><td class="n">${money(t.sub)}</td></tr>${t.tax?`<tr><td>Tax (estimate)</td><td class="n">${money(t.tax)}</td></tr>`:""}<tr><td><b>Total</b></td><td class="n"><b>${money(t.total)}</b></td></tr><tr><td>Paid now</td><td class="n">${money(t.paid)}</td></tr><tr><td><b>Balance</b></td><td class="n"><b style="color:${t.bal>0?"#ff7b84":"#1fa855"}">${money(t.bal)}</b></td></tr></table>`}
function posRes(){const q=POS.q.toLowerCase(),L=(DB.products||[]).filter(p=>p.is_active&&(!q||p.name.toLowerCase().indexOf(q)>=0)).slice(0,q?25:8);$("#pres").innerHTML=L.map(p=>`<div class="li" data-a="posadd" data-i="${esc(p.id)}"><div class="t"><b>${esc(p.name)}</b><small>${esc(p.category)} \u00B7 ${p.track_stock?"Stock "+p.stock:"not tracked"}</small></div><b>${money(p.min_price)}</b></div>`).join("")||'<p class="mu">No match.</p>'}
AFTER.pos=()=>{posRes();posLines();posPays();posTot();
  $("#pq").addEventListener("input",e=>{POS.q=e.target.value;posRes()});
  ["ps:src","pcn:name","pcp:phone","pca:address","pnote:notes"].forEach(s=>{const[a,b]=s.split(":");$("#"+a).addEventListener("input",e=>{POS[b]=e.target.value})});
  $("#pd").addEventListener("input",e=>{POS.disc=num(e.target.value);posTot()});$("#pf").addEventListener("input",e=>{POS.fee=num(e.target.value);posTot()});
  $("#plines").addEventListener("input",e=>{const i=POS.items[e.target.dataset.posi];if(!i)return;i[e.target.dataset.f]=num(e.target.value);posTot()});
  $("#ppays").addEventListener("input",e=>{const p=POS.pays[e.target.dataset.posp];if(!p)return;const f=e.target.dataset.f;p[f]=f==="a"?num(e.target.value):e.target.value;posTot()})};
ACT.posadd=el=>{const p=DB.products.find(x=>x.id===el.dataset.i),ex=POS.items.find(i=>i.id===p.id);if(ex)ex.qty++;else POS.items.push({id:p.id,name:p.name,qty:1,price:num(p.min_price),track:p.track_stock,stock:p.stock});posLines();posTot()};
ACT.posdel=el=>{POS.items.splice(+el.dataset.i,1);posLines();posTot()};
ACT.posaddpay=()=>{POS.pays.push({m:DB.ms[0],a:0,r:""});posPays()};
ACT.posclear=()=>{POS=POSNEW();render()};
ACT.possale=async()=>{if(!POS.items.length)return toast("Add at least one item",true);const t=posTotals();if(t.paid>t.total)return toast("Payments are more than the total",true);
  const r=await rpc("pos_sale",{p:{source:POS.src,customer:{name:POS.name,phone:POS.phone,address:POS.address},items:POS.items.map(i=>({id:i.id,qty:i.qty,unit_price:i.price})),discount:num(POS.disc),delivery_fee:num(POS.fee),notes:POS.notes||null,payments:POS.pays.filter(p=>num(p.a)>0).map(p=>({method:p.m,amount:num(p.a),reference:p.r||null}))}});
  DB.products=null;POS=POSNEW();toast("Sale saved: "+r.ref);await render();await showReceipt(r.receipt_id)};

async function uploadImage(file){const bmp=await createImageBitmap(file),sc=Math.min(1,900/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.82)),path=Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg",t=await token();
  const r=await fetch(SBURL+"/storage/v1/object/product-images/"+path,{method:"POST",headers:{apikey:ANON,Authorization:"Bearer "+t,"Content-Type":"image/jpeg","x-upsert":"true"},body:blob});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(errMsg(j)||"Upload failed")}return SBURL+"/storage/v1/object/public/product-images/"+path}

VIEWS.inventory=async()=>{const P=await products(true),tr=P.filter(p=>p.track_stock&&p.is_active),low=tr.filter(p=>p.stock<=p.low_stock_level),mv=await get("stock_movements","select=*&order=created_at.desc&limit=40");const nm=id=>(P.find(p=>p.id===id)||{}).name||id;
  return `<div class="row"><button class="o s" data-a="back">\u2190 Back</button></div><h2 style="margin-top:10px">Inventory</h2><div class="grid"><div class="kpi"><small>Tracked products</small><b>${tr.length}</b></div><div class="kpi ${low.length?"r":""}"><small>Low or out of stock</small><b>${low.length}</b></div></div>
  <h3>Low stock alerts</h3><div class="box">${low.length?low.map(p=>`<div class="li" data-a="adjsheet" data-i="${esc(p.id)}"><div class="t"><b>${esc(p.name)}</b><small>Alert at ${p.low_stock_level}</small></div><span class="tag ${p.stock===0?"r":"w"}">${p.stock===0?"Out":"Stock "+p.stock}</span></div>`).join(""):'<p class="mu">Nothing is low.</p>'}</div>
  <h3>Adjust stock</h3><div class="box"><input id="iq" placeholder="Search a product"><div id="ires"></div></div>
  <h3>Recent stock movements</h3><div class="box">${mv.map(m=>`<div class="li" style="cursor:default"><div class="t"><b>${esc(nm(m.product_id))}</b><small>${dt(m.created_at)} \u00B7 ${m.reason}${m.note?" \u00B7 "+esc(m.note):""}</small></div><div style="text-align:right"><b style="color:${m.qty_change<0?"#ff7b84":"#1fa855"}">${m.qty_change>0?"+":""}${m.qty_change}</b><br><small class="mu">now ${m.balance_after}</small></div></div>`).join("")||'<p class="mu">No movements yet.</p>'}</div>`};
AFTER.inventory=()=>{const f=()=>{const q=val("iq").toLowerCase();$("#ires").innerHTML=q?DB.products.filter(p=>p.is_active&&p.name.toLowerCase().indexOf(q)>=0).slice(0,15).map(p=>`<div class="li" data-a="adjsheet" data-i="${esc(p.id)}"><div class="t"><b>${esc(p.name)}</b></div><span class="tag">${p.track_stock?"Stock "+p.stock:"Not tracked"}</span></div>`).join(""):""};$("#iq").addEventListener("input",f)};
ACT.adjsheet=el=>{const p=DB.products.find(x=>x.id===el.dataset.i);sheet(`<h3>${esc(p.name)}</h3><p class="mu">${p.track_stock?"Stock now "+p.stock:"Stock is not tracked yet. Saving a change starts tracking."}</p>${fld("Reason",`<select id="ar">${opt([["restock","Stock received"],["damaged","Damaged or lost"],["adjustment","Count correction"],["return","Customer return"]])}</select>`)}${fld("Change (use a minus for removing, for example -2)",'<input id="ad" type="number" inputmode="numeric" placeholder="5">')}${fld("Note","<input id=\"an\">")}<div class="row"><button data-a="doadj" data-i="${esc(p.id)}">Save</button><button class="o" data-a="closesheet">Close</button></div>`)};
ACT.doadj=async el=>{const d=parseInt(val("ad"),10);if(!d)return toast("Enter a change that is not zero",true);await rpc("adjust_stock",{p_product:el.dataset.i,p_delta:d,p_reason:val("ar"),p_note:val("an")||null});DB.products=null;closeSheet();toast("Stock updated");await render()};

VIEWS.customers=async()=>`<div class="row"><button class="o s" data-a="back">\u2190 Back</button></div><h2 style="margin-top:10px">Customers</h2><input id="cq" placeholder="Search by name or phone" style="margin-bottom:10px"><div class="box" id="clist"><p class="mu">Loading\u2026</p></div>`;

let RP={range:"month",from:"",to:"",group:"day"};
const iso=d=>d.toISOString().slice(0,10);
function rpRange(){const n=new Date(),t=iso(n);if(RP.range==="today")return[t,t,"day"];if(RP.range==="week"){const d=new Date(n);d.setDate(d.getDate()-((d.getDay()+6)%7));return[iso(d),t,"day"]}if(RP.range==="month")return[iso(new Date(n.getFullYear(),n.getMonth(),1)),t,"day"];if(RP.range==="year")return[n.getFullYear()+"-01-01",t,"month"];return[RP.from||t,RP.to||t,RP.group]}
VIEWS.reports=async()=>{const [f,t,g]=rpRange(),r=await rpc("report_summary",{p_from:f,p_to:t,p_group:g}),T=r.totals||{},ser=r.series||[],mx=Math.max(1,...ser.map(s=>num(s.sales)));
  return `<div class="row"><button class="o s" data-a="back">\u2190 Back</button></div><h2 style="margin-top:10px">Reports</h2><div class="chips">${[["today","Today"],["week","This week"],["month","This month"],["year","This year"],["custom","Custom"]].map(c=>`<button data-a="rprange" data-i="${c[0]}" class="${RP.range===c[0]?"on":""}">${c[1]}</button>`).join("")}</div>
  ${RP.range==="custom"?`<div class="box"><div class="grid"><div>${fld("From",`<input id="rf" type="date" value="${f}">`)}</div><div>${fld("To",`<input id="rt" type="date" value="${t}">`)}</div></div>${fld("Group by",`<select id="rg">${opt([["day","Day"],["week","Week"],["month","Month"],["year","Year"]],g)}</select>`)}<button data-a="rpgo">Show</button></div>`:""}
  <p class="mu">${f} to ${t}</p><div class="grid"><div class="kpi"><small>Sales (${T.orders||0} orders)</small><b>${money(T.sales)}</b></div><div class="kpi"><small>Money received</small><b>${money(T.received)}</b></div><div class="kpi"><small>Refunds</small><b>${money(T.refunded)}</b></div><div class="kpi"><small>Expenses</small><b>${money(T.expenses)}</b></div><div class="kpi ${num(T.est_profit)<0?"r":""}"><small>Estimated profit</small><b>${money(T.est_profit)}</b></div><div class="kpi r"><small>Still owed to you</small><b>${money(r.outstanding)}</b></div></div>
  <p class="mu" style="font-size:12px">Estimated profit = sales without tax, minus the cost you entered for each product, minus expenses. Costs left at zero make profit look higher than it is.</p>
  <h3>By period</h3><div class="box">${ser.map(s=>`<div style="margin-bottom:10px"><div class="row"><b>${s.d}</b><span class="sp"></span><span>${money(s.sales)}</span></div><div class="bar"><i style="width:${Math.round(num(s.sales)/mx*100)}%"></i></div><small class="mu">${s.orders} orders \u00B7 received ${money(s.received)} \u00B7 expenses ${money(s.expenses)} \u00B7 profit ${money(s.est_profit)}</small></div>`).join("")||'<p class="mu">No data in this range.</p>'}</div>
  <h3>Payment methods</h3><div class="box">${(r.by_method||[]).map(m=>`<div class="li" style="cursor:default"><div class="t"><b>${ML[m.method]||m.method}</b><small>${m.kind==="provider"?"Provider verified":"Recorded by staff"}</small></div><b>${money(m.amount)}</b></div>`).join("")||'<p class="mu">None.</p>'}</div>
  <h3>Expenses by category</h3><div class="box">${(r.expenses_by_category||[]).map(m=>`<div class="li" style="cursor:default"><div class="t"><b>${esc(m.category)}</b></div><b>${money(m.amount)}</b></div>`).join("")||'<p class="mu">None.</p>'}</div>`};

VIEWS.settings=async()=>{const s=await settings(true),b=s.business||{},r=s.receipt||{},d=s.delivery||{},t=s.tax||{},pm=s.payment_methods||[],pr=s.promo||{},sl=s.sale||{};
  const sec=(k,title,body)=>`<h3>${title}</h3><div class="box">${body}<button data-a="setsave" data-i="${k}">Save ${title.toLowerCase()}</button></div>`;
  return `<div class="row"><button class="o s" data-a="back">\u2190 Back</button></div><h2 style="margin-top:10px">Business settings</h2>
  ${sec("business","Business details",fld("Business name",`<input id="b_name" value="${esc(b.name||"")}">`)+fld("Owner",`<input id="b_owner" value="${esc(b.owner||"")}">`)+fld("Address",`<input id="b_address" value="${esc(b.address||"")}">`)+fld("Phone numbers (comma separated)",`<input id="b_phones" value="${esc((b.phones||[]).join(", "))}">`)+fld("Email",`<input id="b_email" value="${esc(b.email||"")}">`)+fld("Tax identification number (TIN)",`<input id="b_tin" value="${esc(b.tin||"")}">`)+fld("MoMo number shown to customers",`<input id="b_momo" value="${esc(b.momo_number||"")}">`))}
  ${sec("receipt","Receipts",fld("Receipt number prefix",`<input id="r_prefix" value="${esc(r.prefix||"PDX")}">`)+fld("Number length (digits)",`<input id="r_pad" type="number" value="${r.pad||6}">`)+fld("Footer message",`<input id="r_footer" value="${esc(r.footer||"")}">`)+'<p class="mu" style="font-size:12px">Receipt numbers look like PREFIX-2026-000001 and never repeat.</p>')}
  ${sec("delivery","Delivery",fld("Standard delivery fee (GH\u20B5)",`<input id="d_flat" type="number" value="${num(d.flat_fee)}">`)+fld("Free delivery above (GH\u20B5)",`<input id="d_free" type="number" value="${num(d.free_over)}">`)+fld("Fees by region (one per line, for example Eastern=50)",`<textarea id="d_zones" rows="3">${esc((d.zones||[]).map(z=>z.region+"="+z.fee).join("\n"))}</textarea>`))}
  ${sec("tax","Tax",`<label class="ck"><input id="t_on" type="checkbox" ${t.enabled?"checked":""}> Apply tax to new sales</label>`+fld("Tax name",`<input id="t_label" value="${esc(t.label||"VAT")}">`)+fld("Combined rate (%)",`<input id="t_rate" type="number" step="0.01" value="${num(t.rate)}">`)+`<label class="ck"><input id="t_inc" type="checkbox" ${t.inclusive!==false?"checked":""}> Prices already include tax</label><p class="mu" style="font-size:12px">Ask your accountant for the correct Ghana rate for your business before you switch this on.</p>`)}
  ${sec("payment_methods","Payment methods",Object.keys(ML).filter(m=>m!=="card_online").map(m=>`<label class="ck"><input type="checkbox" class="pm-c" value="${m}" ${pm.indexOf(m)>=0?"checked":""}> ${ML[m]}</label>`).join(""))}
  ${sec("promo","Discount code",fld("Code",`<input id="p_code" value="${esc(pr.code||"")}">`)+fld("Percent off",`<input id="p_pct" type="number" value="${num(pr.percent)}">`)+fld("Ends (date and time)",`<input id="p_end" type="datetime-local" value="${(pr.ends_at||"").slice(0,16)}">`)+`<label class="ck"><input id="p_on" type="checkbox" ${pr.active?"checked":""}> Active</label>`)}
  ${sec("sale","Store sale",fld("Percent off sale items",`<input id="s_pct" type="number" value="${num(sl.percent)}">`)+fld("Ends (date and time)",`<input id="s_end" type="datetime-local" value="${(sl.ends_at||"").slice(0,16)}">`)+`<label class="ck"><input id="s_on" type="checkbox" ${sl.active?"checked":""}> Active</label><p class="mu" style="font-size:12px">The sale banner in the customer app follows its own dates. Keep both the same.</p>`)}`};
ACT.setsave=async el=>{const k=el.dataset.i;let v;
  if(k==="business")v={name:val("b_name"),owner:val("b_owner"),address:val("b_address"),phones:val("b_phones").split(",").map(x=>x.trim()).filter(Boolean),email:val("b_email"),tin:val("b_tin"),currency:"GHS",momo_number:val("b_momo")};
  else if(k==="receipt")v={prefix:val("r_prefix").toUpperCase().replace(/[^A-Z0-9]/g,"")||"PDX",pad:Math.min(10,Math.max(3,parseInt(val("r_pad"),10)||6)),footer:val("r_footer")};
  else if(k==="delivery")v={flat_fee:num(val("d_flat")),free_over:num(val("d_free")),zones:val("d_zones").split("\n").map(l=>l.split("=")).filter(a=>a[0]&&a[1]).map(a=>({region:a[0].trim(),fee:num(a[1])}))};
  else if(k==="tax")v={enabled:chk("t_on"),label:val("t_label")||"VAT",rate:num(val("t_rate")),inclusive:chk("t_inc")};
  else if(k==="payment_methods")v=[...document.querySelectorAll(".pm-c")].filter(c=>c.checked).map(c=>c.value);
  else if(k==="promo")v={code:val("p_code").toUpperCase(),percent:num(val("p_pct")),active:chk("p_on"),ends_at:val("p_end")?new Date(val("p_end")).toISOString():"2000-01-01T00:00:00+00:00"};
  else v={percent:num(val("s_pct")),active:chk("s_on"),ends_at:val("s_end")?new Date(val("s_end")).toISOString():"2000-01-01T00:00:00+00:00"};
  await rpc("save_settings",{p_key:k,p_value:v});DB.settings=null;toast("Saved")};
/* --------------------------------------------------------- audit, export */
VIEWS.audit=async()=>{const l=await get("audit_log","select=*&order=at.desc&limit=150");return `<div class="row"><button class="o s" data-a="back">\u2190 Back</button></div><h2 style="margin-top:10px">Audit log</h2><p class="mu">Every important action is recorded. Entries cannot be edited or deleted.</p><div class="box">${l.map(a=>`<div class="li" style="cursor:default"><div class="t"><b>${esc(a.action)}${a.ref?" \u00B7 "+esc(a.ref):""}</b><small>${dt(a.at)} \u00B7 ${esc(a.actor_email||"system")}</small><small style="word-break:break-all">${esc(JSON.stringify(a.meta||{}))}</small></div></div>`).join("")||'<p class="mu">Nothing yet.</p>'}</div>`};
VIEWS.backup=async()=>`<div class="row"><button class="o s" data-a="back">\u2190 Back</button></div><h2 style="margin-top:10px">Export and backup</h2><div class="box"><p>Download a copy of your records as spreadsheet files (CSV). Keep them somewhere safe, away from this phone.</p>${[["orders","created_at.asc","Orders"],["payments","id.asc","Payments"],["refunds","id.asc","Refunds"],["receipts","issued_at.asc","Receipts"],["products","id.asc","Products"],["customers","created_at.asc","Customers"],["stock_movements","id.asc","Stock movements"],["expenses","id.asc","Expenses"],["audit_log","id.asc","Audit log"]].map(t=>`<button class="o" style="margin:0 8px 8px 0" data-a="csv" data-t="${t[0]}" data-o="${t[1]}">${t[2]}</button>`).join("")}</div><div class="box"><b>Full database backup</b><p class="mu">Supabase makes daily backups of the whole database. To restore, follow BACKUP_RECOVERY.md. Financial records cannot be deleted from this dashboard or by staff, so a backup protects you from outside damage and mistakes in Supabase itself.</p></div>`;
ACT.csv=async el=>{const t=el.dataset.t,o=el.dataset.o;let rows=[],off=0;for(;;){const r=await get(t,"select=*&order="+o+"&limit=1000&offset="+off);rows=rows.concat(r);if(r.length<1000)break;off+=1000}if(!rows.length)return toast("Nothing to export yet");const keys=Object.keys(rows[0]),q=v=>{v=v==null?"":typeof v==="object"?JSON.stringify(v):String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},csv=[keys.join(",")].concat(rows.map(r=>keys.map(k=>q(r[k])).join(","))).join("\n"),u=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv"})),a=document.createElement("a");a.href=u;a.download="pandox-"+t+"-"+iso(new Date())+".csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Downloaded "+rows.length+" rows")};

boot();
